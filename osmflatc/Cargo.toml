[package]
name = "osmflatc"
version = "0.3.1"
authors = [
    "boxdot <d@zerovolt.org>",
    "Christian Vetter <veaac.fdirct@gmail.com>",
    "Gabriel Féron <feron.gabriel@gmail.com>"
]
license = "MIT/Apache-2.0"
description = "Compiler of OpenStreetMap (OSM) Data from osm.pbf format to osm.flatdata format"
repository = "https://github.com/boxdot/osmflat-rs"
keywords = ["serialization", "osm", "openstreetmap", "flatdata"]
categories = ["encoding"]
readme = "README.md"
edition = "2021"

[lib]
name = "osmflatc"
path = "src/lib.rs"

[[bin]]
name = "osmflatc"
path = "src/main.rs"

[features]
default = []
# Exposes the internal processing stages + mock RocksDB batch so benchmarks
# (which see only the public API) can drive them with synthetic PrimitiveBlocks.
test-support = []

[[bench]]
name = "processing"
harness = false
required-features = ["test-support"]

[dependencies]
byteorder = "1.4.3"
bytes = "1.4.0"
clap = { version = "4.1.4", features = ["derive"] }
env_logger = "0.11.0"
flatdata = "0.5.3"
flate2 = "1.0.25"
itertools = "0.13.0"
log = "0.4.17"
memmap2 = "0.9.0"
osmflat = "0.3.0"
parking_lot = "0.12.1"
prost = "0.13.2"
prost-derive = "0.13.2"
prost-types = "0.13.2"
rayon = "1.12.0"
ahash = "0.8.3"
indicatif = "0.17.3"
space-time = "0.5.0"
geo = "0.28.0"
rocksdb = { version = "0.22.0", default-features = false, features = [
    "snappy",
] }
thiserror = "2.0.18"
tempfile = "3.10.0"

[build-dependencies]
prost-build = "0.13.2"

[dev-dependencies]
criterion = "0.5"
proptest = "1.0.0"
